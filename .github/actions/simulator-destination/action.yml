name: Simulator destination
description: Create and boot a clean simulator on the newest runtime of a platform and return its xcodebuild destination

inputs:
  platform:
    description: Platform (iOS, watchOS, tvOS, visionOS simulators or macOS)
    required: false
    default: iOS
  device-type:
    description: Device type name prefix to prefer (iPhone, iPad, Apple Watch, Apple TV, Apple Vision)
    required: false
    default: iPhone
  destination:
    description: Explicit destination; skips simulator creation when set
    required: false
    default: ""

outputs:
  destination:
    description: xcodebuild destination
    value: ${{ steps.resolve.outputs.destination }}
  udid:
    description: Created simulator id; empty when no simulator was created
    value: ${{ steps.resolve.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Create simulator
      id: resolve
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        DEVICE_TYPE: ${{ inputs.device-type }}
        EXPLICIT_DESTINATION: ${{ inputs.destination }}
        SIMULATOR_NAME: CI ${{ github.run_id }}-${{ github.run_attempt }} ${{ github.job }}
      run: |
        set -euo pipefail
        if [ -n "$EXPLICIT_DESTINATION" ]; then
          echo "destination=$EXPLICIT_DESTINATION" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$PLATFORM" = "macOS" ]; then
          echo "destination=platform=macOS,arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        selection=$(xcrun simctl list runtimes --json | /usr/bin/python3 -I -c '
        import json, os, re, sys
        platform = {"visionOS": "xrOS"}.get(os.environ["PLATFORM"], os.environ["PLATFORM"])
        prefix = os.environ["DEVICE_TYPE"]
        runtimes = [item for item in json.load(sys.stdin)["runtimes"]
                    if item.get("isAvailable") and re.search(rf"SimRuntime\.{platform}-[0-9-]+$", item["identifier"])]
        runtimes.sort(key=lambda item: [int(part) for part in item["version"].split(".")], reverse=True)
        for runtime in runtimes:
            types = sorted((item for item in runtime.get("supportedDeviceTypes", []) if item["name"].startswith(prefix)),
                           key=lambda item: (int((re.findall(r"\d+", item["name"]) or ["0"])[0]), -len(item["name"])))
            if types:
                print(runtime["identifier"], types[-1]["identifier"])
                break
        ')
        if [ -z "$selection" ]; then
          echo "::error::No available $PLATFORM runtime with a $DEVICE_TYPE device type"
          exit 1
        fi
        runtime_id="${selection%% *}"
        device_type_id="${selection#* }"
        udid=$(xcrun simctl create "$SIMULATOR_NAME" "$device_type_id" "$runtime_id")
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        echo "Created $SIMULATOR_NAME ($device_type_id, $runtime_id): $udid"
        xcrun simctl bootstatus "$udid" -b
        echo "destination=platform=$PLATFORM Simulator,id=$udid" >> "$GITHUB_OUTPUT"
