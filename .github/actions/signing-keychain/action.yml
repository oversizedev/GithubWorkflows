name: Signing keychain
description: Import a signing .p12 into a temporary keychain added to the user search list; remove it with signing-keychain-cleanup

inputs:
  p12:
    description: Base64 of the .p12 with the certificate and its private key
    required: true
  p12-password:
    description: Password of the .p12
    required: true
  certificate:
    description: Certificate name prefix, for example Apple Distribution or Developer ID Application
    required: true
  team-id:
    description: Apple Developer team id the certificate must belong to
    required: true
  intermediates:
    description: Space-separated Apple intermediate certificate names from apple.com/certificateauthority
    required: false
    default: AppleWWDRCAG3 DeveloperIDG2CA DeveloperIDCA

outputs:
  identity:
    description: SHA-1 hash of the signing identity
    value: ${{ steps.import.outputs.identity }}
  serial:
    description: Certificate serial number in hex
    value: ${{ steps.import.outputs.serial }}
  keychain:
    description: Temporary keychain path
    value: ${{ steps.import.outputs.keychain }}

runs:
  using: composite
  steps:
    - name: Import certificate
      id: import
      shell: bash
      env:
        P12_BASE64: ${{ inputs.p12 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        CERTIFICATE: ${{ inputs.certificate }}
        TEAM_ID: ${{ inputs.team-id }}
        INTERMEDIATES: ${{ inputs.intermediates }}
      run: |
        set -euo pipefail
        if [ -z "$P12_BASE64" ]; then
          echo "::error::The $CERTIFICATE .p12 secret is empty"
          exit 1
        fi
        work=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
        keychain="$work/signing.keychain-db"
        keychain_password=$(openssl rand -hex 24)
        security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//' > "$work/search-list"
        {
          echo "SIGNING_WORK=$work"
          echo "SIGNING_KEYCHAIN=$keychain"
        } >> "$GITHUB_ENV"
        umask 077
        printf '%s' "$P12_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$work/certificate.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$work/certificate.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        rm -f "$work/certificate.p12"
        for authority in $INTERMEDIATES; do
          curl -fsSL "https://www.apple.com/certificateauthority/$authority.cer" -o "$work/$authority.cer"
          security import "$work/$authority.cer" -k "$keychain" > /dev/null || true
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        xargs security list-keychains -d user -s "$keychain" < "$work/search-list"
        identities=$(security find-identity -v -p codesigning "$keychain" || true)
        identity=$(printf '%s\n' "$identities" | grep "\"$CERTIFICATE" | grep "($TEAM_ID)" | head -1 | awk '{print $2}' || true)
        if [ -z "$identity" ]; then
          echo "Valid identities:"
          printf '%s\n' "$identities"
          echo "All identities:"
          security find-identity -p codesigning "$keychain" || true
          echo "::error::No valid $CERTIFICATE identity of team $TEAM_ID in the .p12"
          exit 1
        fi
        serial=$(security find-certificate -a -Z -p "$keychain" \
          | awk -v hash="$identity" '/^SHA-1 hash:/ { keep = ($3 == hash) } keep' \
          | openssl x509 -noout -serial | cut -d= -f2)
        echo "Signing identity: $(printf '%s\n' "$identities" | grep "$identity" | sed 's/^ *[0-9]*) [0-9A-F]* //'), serial $serial"
        {
          echo "identity=$identity"
          echo "serial=$serial"
          echo "keychain=$keychain"
        } >> "$GITHUB_OUTPUT"
