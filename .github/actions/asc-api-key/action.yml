name: App Store Connect API key
description: Write the App Store Connect API private key (.p8, plain or base64) to the runner temp directory

inputs:
  key-id:
    description: App Store Connect API key id
    required: true
  private-key:
    description: Contents of AuthKey_<id>.p8, plain text or base64
    required: true

outputs:
  key-path:
    description: Path to the written .p8 file
    value: ${{ steps.write.outputs.key-path }}

runs:
  using: composite
  steps:
    - name: Write private key
      id: write
      shell: bash
      env:
        KEY_ID: ${{ inputs.key-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
          echo "::error::App Store Connect API key id or private key is empty"
          exit 1
        fi
        key_dir="$RUNNER_TEMP/private_keys"
        key_path="$key_dir/AuthKey_${KEY_ID}.p8"
        mkdir -p "$key_dir"
        umask 077
        if printf '%s' "$PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$key_path"
        else
          printf '%s' "$PRIVATE_KEY" | tr -d ' \r\n\t' | base64 --decode > "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            if ! openssl pkey -inform DER -in "$key_path" -out "$key_path.pem" 2>/dev/null; then
              rm -f "$key_path" "$key_path.pem"
              echo "::error::App Store Connect private key is not a .p8 PEM, its base64 or its body without the BEGIN/END lines"
              exit 1
            fi
            mv "$key_path.pem" "$key_path"
          fi
        fi
        if ! openssl pkey -in "$key_path" -noout 2>/dev/null; then
          rm -f "$key_path"
          echo "::error::App Store Connect private key is not a valid PEM private key"
          exit 1
        fi
        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"
