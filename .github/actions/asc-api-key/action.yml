name: App Store Connect API key
description: Write the App Store Connect API private key (.p8, plain or base64) to the runner temp directory

inputs:
  key-id:
    description: App Store Connect API key id
    required: true
  private-key:
    description: Contents of AuthKey_<id>.p8, plain text or base64
    required: true

outputs:
  key-path:
    description: Path to the written .p8 file
    value: ${{ steps.write.outputs.key-path }}

runs:
  using: composite
  steps:
    - name: Write private key
      id: write
      shell: bash
      env:
        KEY_ID: ${{ inputs.key-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
          echo "::error::App Store Connect API key id or private key is empty"
          exit 1
        fi
        key_dir="$RUNNER_TEMP/private_keys"
        key_path="$key_dir/AuthKey_${KEY_ID}.p8"
        mkdir -p "$key_dir"
        umask 077
        if printf '%s' "$PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
          printf '%s\n' "$PRIVATE_KEY" > "$key_path"
        else
          printf '%s' "$PRIVATE_KEY" | base64 --decode > "$key_path"
        fi
        echo "key-path=$key_path" >> "$GITHUB_OUTPUT"
