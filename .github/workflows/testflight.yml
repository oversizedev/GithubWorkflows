name: TestFlight

on:
  workflow_call:
    inputs:
      path:
        type: string
        description: Xcode project path without the .xcodeproj extension
        required: false
        default: ""
      workspace:
        type: string
        description: Xcode workspace path without the .xcworkspace extension; takes precedence over path
        required: false
        default: ""
      scheme:
        type: string
        description: Scheme name
        required: true
      platform:
        type: string
        description: Archive platform (iOS, macOS, tvOS, watchOS or visionOS)
        required: false
        default: iOS
      configuration:
        type: string
        description: Archive configuration; empty uses the scheme archive configuration
        required: false
        default: ""
      team-id:
        type: string
        description: Apple Developer team id
        required: true
      build-number:
        type: string
        description: Explicit CFBundleVersion; empty uses github.run_number + build-number-offset
        required: false
        default: ""
      build-number-offset:
        type: number
        description: Added to github.run_number to form CFBundleVersion
        required: false
        default: 0
      disallowed-configurations:
        type: string
        description: Space-separated configurations that must never reach App Store Connect
        required: false
        default: Debug
      signing:
        type: string
        description: automatic (cloud signing, needs a development certificate on the runner) or manual (Apple Distribution .p12 and a profile managed through the API)
        required: false
        default: automatic
      bundle-id:
        type: string
        description: App bundle identifier; required for manual signing
        required: false
        default: ""
      profile-name:
        type: string
        description: Provisioning profile name the project sets in PROVISIONING_PROFILE_SPECIFIER; required for manual signing
        required: false
        default: ""
      profile-type:
        type: string
        description: Profile type for manual signing (IOS_APP_STORE, TVOS_APP_STORE or MAC_APP_STORE)
        required: false
        default: IOS_APP_STORE
      upload:
        type: boolean
        description: Upload to App Store Connect; false exports the signed package as an artifact
        required: false
        default: true
      pre-build:
        type: string
        description: Shell command that generates the project (for example xcodegen)
        required: false
        default: ""
      xcodegen:
        type: boolean
        description: Install XcodeGen before pre-build
        required: false
        default: false
      runs-on:
        type: string
        description: Runner as JSON; empty picks self-hosted macOS for private repositories and xcode-27 for public ones
        required: false
        default: ""
      xcode-version:
        type: string
        description: Xcode version on GitHub-hosted runners
        required: false
        default: latest-stable
      timeout-minutes:
        type: number
        description: Job timeout
        required: false
        default: 60
    secrets:
      ACTIONS_TOKEN:
        required: false
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true
      DISTRIBUTION_P12:
        required: false
      DISTRIBUTION_P12_PASSWORD:
        required: false
    outputs:
      build-number:
        description: Archived CFBundleVersion
        value: ${{ jobs.testflight.outputs.build-number }}

permissions:
  contents: read

jobs:
  testflight:
    name: ${{ inputs.upload && 'Upload' || 'Export' }} ${{ inputs.scheme }}
    runs-on: ${{ inputs.runs-on != '' && fromJSON(inputs.runs-on) || github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","xcode"]') || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: testflight-${{ github.repository }}-${{ inputs.scheme }}
      cancel-in-progress: false
    outputs:
      build-number: ${{ steps.archive.outputs.build-number }}
    env:
      NSUnbufferedIO: "YES"
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      ARCHIVE_PATH: ${{ github.workspace }}/build/App.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/Export
    steps:
      - name: Check signing inputs
        env:
          SIGNING: ${{ inputs.signing }}
          BUNDLE_ID: ${{ inputs.bundle-id }}
          PROFILE_NAME: ${{ inputs.profile-name }}
        run: |
          case "$SIGNING" in
            automatic) ;;
            manual)
              if [ -z "$BUNDLE_ID" ] || [ -z "$PROFILE_NAME" ]; then
                echo "::error::Manual signing needs bundle-id and profile-name"
                exit 1
              fi
              ;;
            *)
              echo "::error::signing must be automatic or manual, got $SIGNING"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode toolchain
        uses: oversizedev/GithubWorkflows/.github/actions/xcode-setup@main
        with:
          actions-token: ${{ secrets.ACTIONS_TOKEN }}
          xcode-version: ${{ inputs.xcode-version }}
          xcodegen: ${{ inputs.xcodegen }}

      - name: Prepare project
        id: project
        uses: oversizedev/GithubWorkflows/.github/actions/xcode-prepare@main
        with:
          path: ${{ inputs.path }}
          workspace: ${{ inputs.workspace }}
          scheme: ${{ inputs.scheme }}
          derived-data: ${{ env.DERIVED_DATA }}
          pre-build: ${{ inputs.pre-build }}

      - name: Prepare App Store Connect key
        id: asc-key
        uses: oversizedev/GithubWorkflows/.github/actions/asc-api-key@main
        with:
          key-id: ${{ secrets.ASC_KEY_ID }}
          private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Import Apple Distribution certificate
        id: identity
        if: inputs.signing == 'manual'
        uses: oversizedev/GithubWorkflows/.github/actions/signing-keychain@main
        with:
          p12: ${{ secrets.DISTRIBUTION_P12 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          certificate: Apple Distribution
          team-id: ${{ inputs.team-id }}

      - name: Install provisioning profile
        if: inputs.signing == 'manual'
        uses: oversizedev/GithubWorkflows/.github/actions/asc-provisioning-profile@main
        with:
          bundle-id: ${{ inputs.bundle-id }}
          profile-name: ${{ inputs.profile-name }}
          profile-type: ${{ inputs.profile-type }}
          certificate-serial: ${{ steps.identity.outputs.serial }}
          key-path: ${{ steps.asc-key.outputs.key-path }}
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Archive
        id: archive
        uses: oversizedev/GithubWorkflows/.github/actions/xcode-archive@main
        with:
          container-flag: ${{ steps.project.outputs.container-flag }}
          container-path: ${{ steps.project.outputs.container-path }}
          scheme: ${{ inputs.scheme }}
          configuration: ${{ inputs.configuration }}
          disallowed-configurations: ${{ inputs.disallowed-configurations }}
          platform: ${{ inputs.platform }}
          archive-path: ${{ env.ARCHIVE_PATH }}
          derived-data: ${{ env.DERIVED_DATA }}
          team-id: ${{ inputs.team-id }}
          build-number: ${{ inputs.build-number }}
          build-number-offset: ${{ inputs.build-number-offset }}
          signing: ${{ inputs.signing }}
          key-path: ${{ steps.asc-key.outputs.key-path }}
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: ${{ inputs.upload && 'Upload to TestFlight' || 'Export package' }}
        uses: oversizedev/GithubWorkflows/.github/actions/xcode-export@main
        with:
          archive-path: ${{ env.ARCHIVE_PATH }}
          export-path: ${{ env.EXPORT_PATH }}
          method: app-store-connect
          destination: ${{ inputs.upload && 'upload' || 'export' }}
          team-id: ${{ inputs.team-id }}
          signing-style: ${{ inputs.signing }}
          signing-certificate: ${{ inputs.signing == 'manual' && 'Apple Distribution' || '' }}
          provisioning-profiles: ${{ inputs.signing == 'manual' && format('{0}={1}', inputs.bundle-id, inputs.profile-name) || '' }}
          key-path: ${{ steps.asc-key.outputs.key-path }}
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Summary
        env:
          BUILD_NUMBER: ${{ steps.archive.outputs.build-number }}
          ACTION: ${{ inputs.upload && 'Uploaded to TestFlight' || 'Exported' }}
          SCHEME: ${{ inputs.scheme }}
        run: echo "$ACTION $SCHEME build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exported package
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ inputs.scheme }}-${{ inputs.platform }}-${{ steps.archive.outputs.build-number }}
          path: build/Export
          retention-days: 7

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsyms-${{ inputs.scheme }}-${{ inputs.platform }}-${{ steps.archive.outputs.build-number }}
          path: build/App.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove signing material
        if: always()
        uses: oversizedev/GithubWorkflows/.github/actions/signing-cleanup@main
