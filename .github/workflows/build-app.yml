name: Build Packages

on:
  workflow_dispatch:
    inputs:
      path:
        type: string
        description: App xcodeproj file path
        required: true
      scheme:
        type: string
        description: App scheme name
        required: true
      destination:
        type: string
        description: Device name
        required: true
  workflow_call:
    inputs:
      path:
        type: string
        description: App xcodeproj file path
        required: true
      scheme:
        type: string
        description: App scheme name
        required: true
      destination:
        type: string
        description: Device name
        required: true
jobs:

  example:
    name: Run examples
    runs-on: xcode-27
          
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup SwiftPM Config
        run: |
          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build app
        run: |
          xcodebuild clean build \
            -skipPackagePluginValidation \
            -project "${{ inputs.path }}.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -destination "${{ inputs.destination }}" | xcpretty && exit ${PIPESTATUS[0]}
