name: Build Packages

on:
  workflow_dispatch:
    inputs:
      path:
        type: string
        description: App xcodeproj file path
        required: true
      scheme:
        type: string
        description: App scheme name
        required: true
  workflow_call:
    inputs:
      path:
        type: string
        description: App xcodeproj file path
        required: true
      scheme:
        type: string
        description: App scheme name
        required: true
        
jobs:
  example:
    name: Run examples
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","xcode"]') || 'xcode-27' }}
    strategy:
        matrix:
          destination: ['generic/platform=iOS Simulator']
          
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide xcpretty fallback
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v xcpretty >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec cat\n' > "$RUNNER_TEMP/bin/xcpretty"
            chmod +x "$RUNNER_TEMP/bin/xcpretty"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup SwiftPM Config
        run: |
          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build iOS
        run: |
          xcodebuild clean build \
            -skipPackagePluginValidation \
            -project "${{ inputs.path }}.xcodeproj" \
            -scheme "${{ inputs.scheme }}" \
            -sdk iphonesimulator \
            -destination "${{ matrix.destination }}" | xcpretty && exit ${PIPESTATUS[0]}
