name: Release

on:
  workflow_dispatch:
  workflow_call:
      
jobs:
  release:
    name: Release
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release
        uses: softprops/action-gh-release@v2
