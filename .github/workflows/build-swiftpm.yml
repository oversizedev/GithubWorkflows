name: Build Package

on:
  workflow_dispatch:
    inputs:
      package:
        type: string
        description: Package scheme
        required: true
      destination:
        type: string
        description: xcodebuild destination
        required: false
        default: generic/platform=iOS Simulator
  workflow_call:
    inputs:
      package:
        type: string
        description: Package scheme
        required: true
      destination:
        type: string
        description: xcodebuild destination
        required: false
        default: generic/platform=iOS Simulator
      runs-on:
        type: string
        description: Runner as JSON (string label or array); empty picks self-hosted macOS for private repositories and xcode-27 for public ones
        required: false
        default: ""
      xcode-version:
        type: string
        description: Xcode version on GitHub-hosted runners
        required: false
        default: latest-stable
      timeout-minutes:
        type: number
        required: false
        default: 30

permissions:
  contents: read

jobs:
  swiftpm:
    name: Build ${{ inputs.package }} (${{ inputs.destination }})
    runs-on: ${{ inputs.runs-on != '' && fromJSON(inputs.runs-on) || github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","xcode"]') || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 30 }}
    env:
      BUILD_MODE: PRODUCTION
      NSUnbufferedIO: "YES"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode toolchain
        uses: oversizedev/GithubWorkflows/.github/actions/xcode-setup@main
        with:
          actions-token: ${{ secrets.ACTIONS_TOKEN }}
          xcode-version: ${{ inputs.xcode-version || 'latest-stable' }}

      - name: Build package
        run: |
          xcodebuild build \
            -scheme "${{ inputs.package }}" \
            -destination "${{ inputs.destination }}" \
            -derivedDataPath build/DerivedData \
            -scmProvider system \
            -skipPackagePluginValidation \
            -skipMacroValidation
