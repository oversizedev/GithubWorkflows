name: Build Packages

on:
  workflow_dispatch:
    inputs:
      package:
        type: string
        description: Build package names
        required: true
      destination:
        type: string
        description: Destination for build (e.g., generic/platform=iOS Simulator)
        default: generic/platform=iOS Simulator
        required: false

  workflow_call:
    inputs:
      package:
        type: string
        description: Build package names
        required: true
      destination:
        type: string
        description: Destination for build (e.g., generic/platform=iOS Simulator)
        default: generic/platform=iOS Simulator
        required: false
jobs:
  swiftpm:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set environment variable
        run: echo "BUILD_MODE=PRODUCTION" >> $GITHUB_ENV
        
      - name: Setup SwiftPM Config
        run: |
          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build Package
        run: |
          xcodebuild clean build -skipPackagePluginValidation -scheme ${{ inputs.package }} -destination '${{ inputs.destination }}' | xcpretty && exit ${PIPESTATUS[0]}
