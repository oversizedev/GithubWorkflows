name: Build Packages

on:
  workflow_dispatch:
    inputs:
      package:
        type: string
        description: Build package names
        required: true
      destination:
        type: string
        description: Destination for build (e.g., generic/platform=iOS Simulator)
        default: generic/platform=iOS Simulator
        required: false

  workflow_call:
    inputs:
      package:
        type: string
        description: Build package names
        required: true
      destination:
        type: string
        description: Destination for build (e.g., generic/platform=iOS Simulator)
        default: generic/platform=iOS Simulator
        required: false
jobs:
  swiftpm:
    name: Build
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","xcode"]') || 'xcode-27' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
        
      - name: Provide xcpretty fallback
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v xcpretty >/dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec cat\n' > "$RUNNER_TEMP/bin/xcpretty"
            chmod +x "$RUNNER_TEMP/bin/xcpretty"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Set environment variable
        run: echo "BUILD_MODE=PRODUCTION" >> $GITHUB_ENV
        
      - name: Setup SwiftPM Config
        run: |
          echo "machine github.com login oversizedev password ${{ secrets.ACTIONS_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build Package
        run: |
          xcodebuild clean build -skipPackagePluginValidation -scheme ${{ inputs.package }} -destination '${{ inputs.destination }}' | xcpretty && exit ${PIPESTATUS[0]}
